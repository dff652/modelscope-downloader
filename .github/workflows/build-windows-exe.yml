# 路线 C：在 GitHub Actions 的真 Windows 上出 exe（本机 Linux 打不了 PyInstaller Windows 包）。
# 产物：Actions 页面 → 本次运行 → Artifacts → ModelScopeDownloader-exe
# 冒烟：额外打一个 console 版 smoketest.exe，跑 --help + 真下一个小模型的 *.json + --tar，
#       验证 PyInstaller 没漏 modelscope 的动态 import（--windowed 版无法在 CI 里跑，import 集合与 console 版相同）。
# 失败排错：冒烟输出 tee 进 smoke*.log；任何失败自动开 issue 附日志尾部
#       （本机无 admin token 下载不了 Actions 日志，issue 公开可读——这是拿到真实报错的通道）。
name: build-windows-exe

on:
  push:
    branches: [main]
    tags: ["v*"]  # 打 tag → 构建+冒烟全过后自动发 Release（exe 公开永久免登录下载）
  workflow_dispatch:

permissions:
  contents: write  # tag 构建要发 Release；分支构建只用到 read
  issues: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install deps (pyinstaller + modelscope hub-only)
        run: |
          python -m pip install -U pip
          python -m pip install --default-timeout 120 --retries 5 -U pyinstaller modelscope

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate Windows version resource (作者/版本/项目地址进 exe 属性)
        shell: python
        run: |
          import re, pathlib
          src = pathlib.Path("app.py").read_text(encoding="utf-8")
          ver = re.search(r'APP_VERSION = "([^"]+)"', src).group(1)
          author = re.search(r'APP_AUTHOR = "([^"]+)"', src).group(1)
          url = re.search(r'APP_URL = "([^"]+)"', src).group(1)
          nums = (list(map(int, ver.split("."))) + [0, 0, 0, 0])[:4]
          info = f"""VSVersionInfo(
            ffi=FixedFileInfo(filevers={tuple(nums)}, prodvers={tuple(nums)},
                              mask=0x3F, flags=0x0, OS=0x40004, fileType=0x1,
                              subtype=0x0, date=(0, 0)),
            kids=[
              StringFileInfo([StringTable("080404b0", [
                StringStruct("CompanyName", "{author}"),
                StringStruct("FileDescription", "ModelScope 模型下载工具（air-gapped 部署传模型用）"),
                StringStruct("FileVersion", "{ver}"),
                StringStruct("ProductName", "ModelScope Downloader"),
                StringStruct("ProductVersion", "{ver}"),
                StringStruct("LegalCopyright", "MIT License, {author}"),
                StringStruct("Comments", "{url}"),
              ])]),
              VarFileInfo([VarStruct("Translation", [2052, 1200])]),
            ])
          """
          pathlib.Path("version_info.txt").write_text(info, encoding="utf-8")
          print(f"version_info.txt generated: v{ver} by {author}")

      - name: Build windowed exe (operator build, same flags as build.bat)
        run: python -m PyInstaller --onefile --windowed --name ModelScopeDownloader --collect-all modelscope --version-file version_info.txt app.py

      - name: Build console smoketest exe
        run: python -m PyInstaller --onefile --console --name smoketest --collect-all modelscope app.py

      - name: "Smoke 1: exe boots, argparse works"
        run: |
          Get-ChildItem dist | Out-File smoke1.log -Encoding utf8
          & .\dist\smoketest.exe --help 2>&1 | Tee-Object -Append -FilePath smoke1.log
          exit $LASTEXITCODE

      - name: "Smoke 2: real download (json only) + tar + sha256"
        timeout-minutes: 10
        run: |
          & .\dist\smoketest.exe --model Qwen/Qwen3-0.6B --out smoke_out\qwen --include "*.json" --tar 2>&1 | Tee-Object -FilePath smoke2.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path smoke_out\qwen\config.json)) { throw "download failed: no config.json" }
          if (-not (Test-Path smoke_out\qwen.tar)) { throw "no tar produced" }
          if (-not (Test-Path smoke_out\qwen.tar.sha256)) { throw "no sha256 produced" }
          $expected = (Get-Content smoke_out\qwen.tar.sha256 -Raw).Split(" ")[0].Trim()
          $actual = (Get-FileHash smoke_out\qwen.tar -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "sha256 mismatch: file=$expected computed=$actual" }
          Write-Host "[ok] download + tar + sha256 all verified"

      - name: "Smoke 3: windowed parent exe -> CLI child exe"
        timeout-minutes: 10
        run: |
          $p = Start-Process -FilePath .\dist\ModelScopeDownloader.exe `
            -ArgumentList '--_self-spawn-smoke','--model','Qwen/Qwen3-0.6B','--out','smoke_win\q','--include','*.json' `
            -RedirectStandardOutput smoke3.log -RedirectStandardError smoke3.err.log `
            -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { Get-Content smoke3.log, smoke3.err.log; throw "nested windowed CLI exit code $($p.ExitCode)" }
          if (-not (Test-Path smoke_win\q\config.json)) { throw "nested windowed CLI: no config.json downloaded" }
          $out = (Get-Content smoke3.log -Raw -ErrorAction SilentlyContinue)
          if ([string]::IsNullOrWhiteSpace($out)) { Write-Warning "windowed exe piped stdout is EMPTY (GUI log box would be blank)" }
          Write-Host "[ok] windowed parent -> independent CLI child + piped stdout verified"

      - name: "Smoke 4: offline batch + portable checksum verifier"
        timeout-minutes: 10
        run: |
          & .\dist\smoketest.exe --model Qwen/Qwen3-0.6B --out smoke_batch\q --include "*.json" --batch-size-gb 0.01 --batch-number 1 2>&1 | Tee-Object -FilePath smoke4.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path smoke_batch\q\batch-001\config.json)) { throw "batch download: no config.json" }
          $sums = "smoke_batch\q\batch-001\_OFFLINE-SHA256SUMS.batch-001"
          $verify = "smoke_batch\q\batch-001\_OFFLINE-VERIFY.py"
          if (-not (Test-Path $sums)) { throw "batch checksum manifest missing" }
          & python $verify smoke_batch\q\batch-001 $sums
          if ($LASTEXITCODE -ne 0) { throw "portable batch verifier failed" }
          Write-Host "[ok] offline batch + checksum verifier verified"

      - name: Report exe size
        run: Get-Item dist\ModelScopeDownloader.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: ModelScopeDownloader-exe
          path: dist/ModelScopeDownloader.exe
          if-no-files-found: error

      - name: Release (tag builds only, after all smoke gates passed)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 双击即用的 ModelScope 模型下载工具（air-gapped 部署传模型用）。

          **下载下方 Assets 里的 `ModelScopeDownloader.exe` 即可**，无需安装 Python。

          - 双击打开 GUI：普通模型可下载后打包 `.tar`；超大模型可按容量离线分批、逐批 SHA256 校验
          - 首次运行 Windows SmartScreen 可能拦截：点「更多信息」→「仍要运行」
          - 操作步骤详见仓库根目录的 `操作员须知.txt`；命令行用法见 README

          本版本状态：CLI 已在 CI（真 Windows）端到端验证（真实下载 + 打包 + sha256 校验全过）；
          **GUI 尚未在真机点验**，故标记 pre-release。
          '@
          # 资产文件名带版本号（ModelScopeDownloader-v0.3.0.exe）：
          # 操作员机上多版本并存时可分辨；GUI 标题栏也显示版本，双保险
          $asset = "dist\ModelScopeDownloader-$env:GITHUB_REF_NAME.exe"
          Copy-Item dist\ModelScopeDownloader.exe $asset
          gh release create $env:GITHUB_REF_NAME $asset `
            --prerelease `
            --title "ModelScope Downloader $env:GITHUB_REF_NAME" `
            --notes $notes

      - name: Post failure logs as issue (repo has no other readable log channel)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = `CI failure: run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}), commit ${context.sha.slice(0,7)}\n\n`;
            for (const f of ['smoke1.log', 'smoke2.log', 'smoke3.log', 'smoke3.err.log', 'smoke4.log']) {
              if (fs.existsSync(f)) {
                const t = fs.readFileSync(f, 'utf8');
                body += `### ${f}\n\`\`\`\n${t.slice(-6000)}\n\`\`\`\n`;
              } else {
                body += `### ${f}\n(not created — failed before this step)\n`;
              }
            }
            await github.rest.issues.create({
              ...context.repo,
              title: `CI failure: build-windows-exe run ${context.runId}`,
              labels: ['ci-failure'],
              body,
            });
